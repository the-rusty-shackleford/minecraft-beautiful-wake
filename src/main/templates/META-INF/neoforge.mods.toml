modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rusty Shackleford"
# A client-only mod: a server without it is no mismatch.
displayTest="IGNORE_ALL_VERSION"
description='''
The water behind a boat: a foam trail that spreads and fades, the V of a
real wake, and spray off the bow -- for every boat, at any speed worth one.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
