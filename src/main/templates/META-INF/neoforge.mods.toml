modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rusty Shackleford"
# A client-only mod: a server without it is no mismatch.
displayTest="IGNORE_ALL_VERSION"
description='''
The water behind a boat, standing up out of the water: a bow wave, a trough,
chevron ridges in the V, a pale sheet edged in white, a bubbling churn and a
burst of bubbles off the bow -- for every boat, at any speed worth one, and a
touch of it behind anyone wading.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
